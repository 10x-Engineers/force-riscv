# Build FORCE-RISCV, generate the smoke test, and publish outputs:
#   - push / PR / manual: workflow artifact (Actions tab)
#   - release published: .tar.gz attached to the GitHub Release (Assets)
name: FORCE smoke test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  release:
    types: [published]

env:
  TOOLCHAIN_RELEASE: "2026.10.26"

jobs:
  generate-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: ${{ github.event_name == 'release' && 'write' || 'read' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'release' && 0 || 1 }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            make \
            python3 \
            python3-dev \
            wget \
            xz-utils

      - name: Install RISC-V GNU toolchain (prebuilt release)
        run: |
          set -euo pipefail
          . /etc/os-release
          ASSET="riscv64-elf-ubuntu-${VERSION_ID}-gcc.tar.xz"
          BASE_URL="https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${TOOLCHAIN_RELEASE}"
          echo "Downloading ${BASE_URL}/${ASSET}"
          wget -q "${BASE_URL}/${ASSET}" -O /tmp/riscv-toolchain.tar.xz
          mkdir -p "${HOME}/riscv-toolchain"
          tar -xJf /tmp/riscv-toolchain.tar.xz -C "${HOME}/riscv-toolchain"
          echo "${HOME}/riscv-toolchain/riscv/bin" >> "${GITHUB_PATH}"
          riscv64-unknown-elf-gcc --version | head -1

      - name: Configure FORCE build environment
        run: |
          set -euo pipefail
          PY_MAJOR_MINOR="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          echo "FORCE_CC=g++" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_VER=${PY_MAJOR_MINOR}" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_INC=/usr/include/python${PY_MAJOR_MINOR}" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_LIB=/usr/lib/x86_64-linux-gnu" >> "${GITHUB_ENV}"

      - name: Source FORCE environment
        run: |
          set -euo pipefail
          source ./setenv.bash
          echo "PYTHONPATH=${PYTHONPATH}" >> "${GITHUB_ENV}"

      - name: Build FORCE-RISCV
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          make tests

      - name: Generate smoke test
        run: |
          set -euo pipefail
          bin/friscv -t utils/smoke/test_force.py
          test -s test_force.Default.ELF
          test -s test_force.Default.S
          riscv64-unknown-elf-readelf -h test_force.Default.ELF

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: force-smoke-output
          path: |
            test_force.Default.ELF
            test_force.Default.S
            gen.log
            sim.log
          if-no-files-found: ignore

      - name: Package release bundle
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          BUNDLE_DIR="force-riscv-generated-tests-${TAG}"
          mkdir -p "${BUNDLE_DIR}"
          cp -v test_force.Default.ELF test_force.Default.S "${BUNDLE_DIR}/"
          for f in gen.log sim.log; do
            if [ -f "${f}" ]; then
              cp -v "${f}" "${BUNDLE_DIR}/"
            fi
          done
          {
            echo "release_tag=${TAG}"
            echo "git_sha=${GITHUB_SHA}"
            echo "template=utils/smoke/test_force.py"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${BUNDLE_DIR}/MANIFEST.txt"
          tar -czf "force-riscv-generated-tests-${TAG}.tar.gz" "${BUNDLE_DIR}"

      - name: Upload bundle to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "${TAG}" "force-riscv-generated-tests-${TAG}.tar.gz" --clobber
