# Build FORCE-RISCV, generate the smoke test, and publish outputs:
#   - push / PR / manual: workflow artifact (Actions tab)
#   - release published: generated-tests .tar.gz on the release (not source archives)
name: FORCE smoke test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  release:
    types: [published]

env:
  TOOLCHAIN_RELEASE: "2026.10.26"

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            make \
            python3 \
            python3-dev \
            wget \
            xz-utils

      - name: Install RISC-V GNU toolchain (prebuilt release)
        run: |
          set -euo pipefail
          . /etc/os-release
          BASE_URL="https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${TOOLCHAIN_RELEASE}"
          INSTALLED=0
          for VER in "${VERSION_ID}" "24.04" "22.04"; do
            ASSET="riscv64-elf-ubuntu-${VER}-gcc.tar.xz"
            URL="${BASE_URL}/${ASSET}"
            echo "Trying ${URL}"
            if wget -q --spider "${URL}" && wget -q "${URL}" -O /tmp/riscv-toolchain.tar.xz; then
              INSTALLED=1
              break
            fi
          done
          if [ "${INSTALLED}" -ne 1 ]; then
            echo "No supported riscv-gnu-toolchain Ubuntu asset found."
            exit 1
          fi
          mkdir -p "${HOME}/riscv-toolchain"
          tar -xJf /tmp/riscv-toolchain.tar.xz -C "${HOME}/riscv-toolchain"
          TOOLCHAIN_BIN="${HOME}/riscv-toolchain/riscv/bin"
          test -x "${TOOLCHAIN_BIN}/riscv64-unknown-elf-gcc"
          # GITHUB_PATH applies to later steps only; export for this step too.
          echo "${TOOLCHAIN_BIN}" >> "${GITHUB_PATH}"
          echo "RISCV_TOOLCHAIN_BIN=${TOOLCHAIN_BIN}" >> "${GITHUB_ENV}"
          export PATH="${TOOLCHAIN_BIN}:${PATH}"
          riscv64-unknown-elf-gcc --version | head -1

      - name: Configure FORCE build environment
        run: |
          set -euo pipefail
          PY_MAJOR_MINOR="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          echo "FORCE_CC=g++" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_VER=${PY_MAJOR_MINOR}" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_INC=/usr/include/python${PY_MAJOR_MINOR}" >> "${GITHUB_ENV}"
          echo "FORCE_PYTHON_LIB=/usr/lib/x86_64-linux-gnu" >> "${GITHUB_ENV}"

      - name: Source FORCE environment
        run: |
          set -euo pipefail
          source ./setenv.bash
          echo "PYTHONPATH=${PYTHONPATH}" >> "${GITHUB_ENV}"

      - name: Build FORCE-RISCV
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          make tests

      - name: Generate smoke tests from smoke-list
        run: |
          set -euo pipefail
          export PATH="${RISCV_TOOLCHAIN_BIN}:${PATH}"
          ./utils/smoke/run_smoke_list.sh
          elf="$(find smoke-output -name '*.Default.ELF' | head -1)"
          test -n "${elf}"
          riscv64-unknown-elf-readelf -h "${elf}"
          find smoke-output -name '*.Default.ELF' -print

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: force-smoke-output
          path: smoke-output/
          if-no-files-found: error

      - name: Upload generated test bundle for release job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-generated-tests
          path: smoke-output/
          if-no-files-found: error

  publish-release-tests:
    if: github.event_name == 'release'
    needs: build-and-generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: release-generated-tests

      - name: Package release bundle
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          BUNDLE_DIR="force-riscv-generated-tests-${TAG}"
          mkdir -p "${BUNDLE_DIR}"
          cp -a . "${BUNDLE_DIR}/"
          {
            echo "release_tag=${TAG}"
            echo "git_sha=${{ github.sha }}"
            echo "smoke_list=utils/smoke/smoke-list"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "This archive contains only FORCE-generated smoke test outputs."
            echo "Each subdirectory is one smoke-list entry (see INDEX.txt)."
            echo "Do not download the GitHub 'Source code' zip/tar on the release page."
          } > "${BUNDLE_DIR}/MANIFEST.txt"
          tar -czf "force-riscv-generated-tests-${TAG}.tar.gz" "${BUNDLE_DIR}"

      - name: Remove non-generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          mapfile -t ASSET_IDS < <(
            gh api "repos/${REPO}/releases/tags/${TAG}" --jq \
              '.assets[] | select(.name | test("force-riscv-generated-tests-") | not) | .id'
          )
          for id in "${ASSET_IDS[@]}"; do
            echo "Deleting release asset id ${id}"
            gh api -X DELETE "repos/${REPO}/releases/assets/${id}"
          done

      - name: Upload generated-tests bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "${TAG}" "force-riscv-generated-tests-${TAG}.tar.gz" --clobber
